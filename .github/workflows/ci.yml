
name: CI - Tests, Docker Publish & Render Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests -v

  docker-publish:
    name: Build & Publish Docker Image to GHCR
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render-deploy:
    name: Deploy Latest Image to Render
    needs: docker-publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}

        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL secret is missing."
            exit 1
          fi

          # Encode the exact GHCR image URL for Render.
          IMAGE_URL="${IMAGE_NAME,,}:${IMAGE_TAG}"
          ENCODED_IMAGE_URL=$(python -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGE_URL")

          echo "Triggering Render deployment..."
          echo "Image: ${IMAGE_NAME,,}:${IMAGE_TAG}"

          # Render deploy hooks already contain a query parameter (key).
          # Append imgURL so Render pulls this exact image from GHCR.
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/render-response.json \
            --write-out "%{http_code}" \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&imgURL=${ENCODED_IMAGE_URL}")

          echo "Render HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "ERROR: Render deployment request failed."
            exit 1
          fi

          echo "Render accepted the deployment request."
