
name: CI - Tests, Docker Publish & Render Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests -v

  docker-publish:
    name: Build and Push Docker Image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  render-deploy:
    name: Deploy Latest GHCR Image to Render
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Validate Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ.get("RENDER_DEPLOY_HOOK_URL", "").strip()

          if not url:
              raise SystemExit(
                  "ERROR: RENDER_DEPLOY_HOOK_URL is missing from GitHub Repository Secrets."
              )

          parsed = urlparse(url)

          print("Deploy hook hostname:", parsed.hostname or "INVALID")

          if parsed.scheme != "https":
              raise SystemExit("ERROR: Deploy hook must use HTTPS.")

          if parsed.hostname != "api.render.com":
              raise SystemExit(
                  "ERROR: This is not a Render deploy hook URL. "
                  "Open Render Dashboard > Your Service > Settings > Deploy Hook "
                  "and update the GitHub Repository Secret."
              )

          if not parsed.path.startswith("/deploy/") or not parsed.query:
              raise SystemExit(
                  "ERROR: Deploy hook URL format is invalid. "
                  "Copy the complete URL from Render."
              )

          print("Render deploy hook format validated.")

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write("VALIDATED_RENDER_HOOK=" + url + "\n")
          PY

      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment..."
          echo "Render will pull the image tag configured in its service settings."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/render-response.txt \
            --write-out "%{http_code}" \
            --request GET \
            "$RENDER_DEPLOY_HOOK_URL")

          echo "Render HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "ERROR: Render did not accept the deployment request."
            echo "Response body:"
            cat /tmp/render-response.txt
            exit 1
          fi

          echo "SUCCESS: Render accepted the deployment request."
          cat /tmp/render-response.txt
